[project]
name = "chainguard"
version = "0.1.0"
description = "Temporal Heterogeneous GNN for Cross-Chain Cryptocurrency Fraud Detection"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "networkx>=3.1",
    "mlflow>=2.8",
    "jupyter>=1.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
